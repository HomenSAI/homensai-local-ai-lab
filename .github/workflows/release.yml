name: release

# Creates a GitHub release from the matching CHANGELOG.md section.
# Run from the Actions tab (Run workflow) with tag e.g. v1.1.0 and an optional commit to tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create, e.g. v1.1.0"
        required: true
      target:
        description: "Commit to tag (empty = default branch head)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid tag: $TAG (expected vX.Y or vX.Y.Z)" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          python3 - "${TAG#v}" > notes.md <<'PY'
          import re, sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^## \[?" + re.escape(version) + r"\]?(?:[ —-][^\n]*)?\n(.*?)(?=^## |\Z)",
              text,
          )
          if not match or not match.group(1).strip():
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          print(match.group(1).strip())
          PY
          args=("$TAG" --title "$TAG" --notes-file notes.md)
          if [[ -n "$TARGET" ]]; then
            args+=(--target "$(git rev-parse --verify "$TARGET^{commit}")")
          fi
          gh release create "${args[@]}"
