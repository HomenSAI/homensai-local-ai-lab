name: checks
on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile console/*.py scripts/*.py tests/*.py benchmarks/*.py
      - name: Unit tests (console security, report builder, public results, installer)
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: for f in console/*.js report/*.js; do node --check "$f"; done
      - name: PowerShell installer parses
        shell: pwsh
        run: |
          $e = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$e)
          if ($e) { $e; exit 1 }
      - name: Translations complete (DE and EN)
        run: |
          node scripts/check_i18n.js de
          node scripts/check_i18n.js en
      - name: MANIFEST.json is up to date
        run: python scripts/make_manifest.py --check
      - name: Compose configuration is valid
        run: |
          cp .env.example .env
          python scripts/install.py init || true
          docker compose --profile gateway --profile build config -q
          docker compose -f docker-compose.yml -f docker-compose.nogpu.yml config -q
      - name: No secrets or personal data
        run: |
          ! grep -rEn "hf_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY" --exclude-dir=.git .
