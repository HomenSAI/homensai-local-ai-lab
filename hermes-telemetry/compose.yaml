services:
  hermes-telemetry:
    build: .
    image: hermes-telemetry:local
    container_name: hermes-telemetry
    restart: unless-stopped
    gpus: all
    init: true
    networks: [ai-net, local-ai-server]
    ports:
      - "${TELEMETRY_BIND_IP:-127.0.0.1}:9835:9835/tcp"
    environment:
      LLAMA_SWAP_URL: http://llama-swap-gateway:8080
      # Optional: comma-separated llama-server URLs running outside the gateway.
      LLAMA_URLS: ""
      SAMPLE_INTERVAL_SECONDS: "5"
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,uid=65532,gid=65532
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9835/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 10s
networks:
  ai-net:
    external: true
  local-ai-server:
    external: true
    name: local-ai-server_default
